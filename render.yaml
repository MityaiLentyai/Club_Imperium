services:
  - type: web
    name: warsaw-lifescore-api
    runtime: python
    plan: free
    buildCommand: pip install -r configs/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEOCODING_USER_AGENT
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEOCODING_URL
        value: https://nominatim.openstreetmap.org/search
